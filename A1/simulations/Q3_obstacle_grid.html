<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Obstacles experiment</title>
  <style>
    body{ font-family: "HelveticaNeue-Light", sans-serif; padding: 15px; }
  </style>
  <script src="../artistoo_minimal/build/artistoo.js"></script>
  <script>
  "use strict"

  // ======= CONTROL OBSTACLE DENSITY HERE =======
  // Smaller spacing => higher obstacle density
  let OBSTACLE_SPACING = 40
  let OBSTACLE_MARGIN  = 5
  

  // true  = place motile cells INSIDE the obstacle grid region (your current code)
  // false = place motile cells OUTSIDE that region (in the border band)
  let PLACEMENT_GRID = false

  let volume = 500
  var radius = Math.sqrt(volume / Math.PI);
  var perimeter = 2 * Math.PI * radius;
  let N_CELLS = 20

  let config = {
    ndim : 2,
    field_size : [200,200],

    conf : {
      T : 20,

      // 0 = background, 1 = motile cells, 2 = obstacles
      J: [
        [0, 20, 30],
        [20, 0,  0],
        [30, 0,  0]
      ],

      LAMBDA_V : [0, 50, 500],
      V        : [0, volume, volume/2],

      LAMBDA_P : [0,  1,  50],
      P        : [0, 340, perimeter/2],

      LAMBDA_ACT : [0, 200, 0],
      MAX_ACT    : [0,  20, 0],
      ACT_MEAN   : "arithmetic"
    },

    simsettings : {
      NRCELLS : [N_CELLS, 0],
      RUNTIME : 500,
      zoom : 4,
      CANVASCOLOR : "eaecef",
      CELLCOLOR : ["ff4d4d", "4d79ff"],
      SHOWBORDERS : [true, true],
      BORDERCOL   : ["000000", "000000"],
      ACTCOLOR : [true, false]
    }
  }

  // seed obstacles on a lattice + seed cells on an offset lattice.
  function initializeGrid(){
    if( !this.helpClasses["gm"] ){ this.addGridManipulator() }

    const W = this.C.extents[0], H = this.C.extents[1]
    const spacing = OBSTACLE_SPACING
    const margin  = OBSTACLE_MARGIN

    const Vobs = this.C.conf.V[2] 
    const rObs = Math.max(2, Math.round(Math.sqrt(Vobs / Math.PI)))

    // 1) Seed obstacles regularly
    for( let x = margin; x < W - margin; x += spacing ){
      for( let y = margin; y < H - margin; y += spacing ){
        // create a new obstacle cell at (x,y)
        const cid = this.gm.seedCellAt( 2, [x,y] )
        let vox = []
        vox = this.gm.makeCircle( [x,y], rObs, vox )          
        this.gm.assignCellPixels( vox, 2, cid )               
      }
    }
    function isInsideObstacleRegion(x,y){
      return (x >= margin && x < W - margin && y >= margin && y < H - margin)
    }

    // 2) Seed motile cells inside or outside the obstacle region, depending on PLACEMENT_GRID
    let seeded = 0
    let attempts = 0    
    const maxAttempts = N_CELLS * 500

    while( seeded < N_CELLS && attempts < maxAttempts){
   attempts++

      let x, y

      if( PLACEMENT_GRID ){
        // INSIDE
        x = margin + Math.floor( Math.random()*(W - 2*margin) )
        y = margin + Math.floor( Math.random()*(H - 2*margin) )
      } else {
        // OUTSIDE
        x = Math.floor( Math.random()*W )
        y = Math.floor( Math.random()*H )
        if( isInsideObstacleRegion(x,y) ) continue
      }

      // only seed if the pixel is background (not already an obstacle/cell)
      if( this.C.pixt([x,y]) === 0 ){
        this.gm.seedCellAt( 1, [x,y] )
        seeded++
      }
    }
    // fallback
    while( seeded < N_CELLS ){
      this.gm.seedCell( 1 )
      seeded++
    }
  }

  let sim
  function initialize(){
    const custommethods = { initializeGrid : initializeGrid }
    sim = new CPM.Simulation( config, custommethods ) 
    step()
  }

  function step(){
    sim.step()
    requestAnimationFrame( step )
  }
  </script>
</head>

<body onload="initialize()">
  <h1>Obstacles experiment</h1>
  <p>
    Change <code>OBSTACLE_SPACING</code> to control density (smaller = more obstacles).
    Borders show separation; activity coloring shows “acting” regions.
  </p>
</body>
</html>
