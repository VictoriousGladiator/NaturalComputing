<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Obstacles experiment</title>
  <style>
    body{ font-family: "HelveticaNeue-Light", sans-serif; padding: 15px; }
  </style>
  <script src="../artistoo_minimal/build/artistoo.js"></script>
  <script>
  "use strict"

  // ======= CONTROL OBSTACLE DENSITY HERE =======
  // Smaller spacing => higher obstacle density
  let OBSTACLE_SPACING = 30
  let OBSTACLE_MARGIN  = 20

var volume = 500;
let config = {

	// Grid settings
	ndim : 3,
	field_size : [200,200],
	
	// CPM parameters and configuration
	conf : {
    // Temperature
		T : 20,			
				
		// Adhesion
		J: [
        [0, 20, 30], 
        [20, 0, 0],
        [30, 0, 0]
          ],
		
		// Hamiltonian
		LAMBDA_V :        [0, 50, 500],	
		LAMBDA_P :        [0, 2, 50],
		LAMBDA_ACT :      [0, 140, 0],
		MAX_ACT :         [0, 50, 0],
		ACT_MEAN :        "arithmetic",
		P :               [0, 340, 56],
		V :               [0, volume, volume/2],		

	},
	
	simsettings : {
    NRCELLS :         [10, 0],
    RUNTIME :         500,
    zoom :            4,
    CELLCOLOR :       ["ff4d4d", "4d79ff"]
    }
}

// custom methods for creating round static obstacle grid
function seedDisk(kind, cx, cy, r){
  const cid = gm.seedCellAt(kind, [cx, cy]);
  const r2 = r*r
  for(let dx = -r; dx <= r; dx++){
    for(let dy = -r; dy <= r; dy++){
      if(dx*dx + dy*dy <= r2){
        const x = cx + dx
        const y = cy + dy
        if(x >= 0 && x < config.field_size[0] && y >= 0 && y < config.field_size[1]){
          sim.C.setpix([x,y], cid)
        }
      }
    }
  }
}

function seedObstaclesRegular(spacing=50, margin=50, radius=6){
  for(let x = margin; x < config.field_size[0] - margin; x += spacing){
    for(let y = margin; y < config.field_size[1] - margin; y += spacing){
      seedDisk(2, x, y, radius);
    }
  }
}

let sim;
let gm;
function initialize(){
  sim = new CPM.Simulation(config)
  gm = new CPM.GridManipulator(sim.C);
  seedObstaclesRegular(25, 10, 2)
  step()
}
function step(){
    sim.step()
    requestAnimationFrame( step )
}

</script>
</head>

<body onload="initialize()">
  <h1>Obstacles experiment</h1>
  <p>
    Change <code>OBSTACLE_SPACING</code> to control density (smaller = more obstacles).
    Borders show separation; activity coloring shows “acting” regions.
  </p>
</body>
</html>
