<!-- Page setup and title -->
<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Type" content="text/html;
charset=UTF-8">
<title>PageTitle</title>
<style type="text/css"> 
body{
    font-family: "HelveticaNeue-Light", sans-serif; padding : 15px;
}
</style>

<!-- Sourcing the cpm build -->
<script src="../artistoo_minimal/build/artistoo.js"></script>
<script>
"use strict"


let config = {

	// Grid settings
	ndim : 2,
	field_size : [250, 250],
	
	// CPM parameters and configuration
	conf : {
		// Temperature
		T : 20,		
				
		// Adhesion 
		J: [	
			[0, 20], 
			[20, 10]
			],
		
		// Hamiltonian
		LAMBDA_V : 		[0, 50],	
		LAMBDA_P : 		[0, 2],
		LAMBDA_ACT : 	[0, 0],
		MAX_ACT : 		[0, 50],
		ACT_MEAN : 		"arithmetic",
		P : 			[0, 340],
		V : 			[0, 500]		
	},
	
	simsettings : {
		NRCELLS : 		[1],	
		RUNTIME : 		500,                
		CANVASCOLOR : 	"eaecef",
		zoom : 			4	
	}
}

let sim
function initialize(){
    sim = new CPM.Simulation( config )
    step()
}
function step(){
    sim.step()
    requestAnimationFrame( step )
}

</script>
</head>
<body onload="initialize()">
<h1>Init simulation</h1>
<p>
Simulation we were given to start with. 
</p>
</body>
</html>
